<!doctype html>
<meta charset="utf-8">
<title>LLP demo stage</title>
<!-- The recording stage for tools/demo-gif/record.mjs (4:5, for phone feeds). Both sides are real:
     Today (top): the conventional tasks app (tools/demo-gif/today-app) in an iframe, redeployed by the
     real pipeline in today-pipeline.mjs (git push, GitHub Actions, restart).
     With LLP (bottom): a real Live Host (host/llp-core.js) connected to the real AI publisher.
     Clocks are real elapsed time; when the video is sped up, the page says so. -->
<style>
:root { --bg: #0b0f15; --panel: #141b26; --line: #263244; --ink: #f2f5fa; --muted: #8a96aa;
  --live: #3ddc97; --bad: #ff5d73; --warn: #ffb347; --accent: #8b9bff; --t: #ff8a9b; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 720px; height: 900px; overflow: hidden; background: var(--bg); color: var(--ink); font: 18px/1.3 Inter, system-ui, sans-serif; }
.top { position: absolute; left: 28px; right: 28px; top: 22px; height: 118px; }
.top h1 { margin: 0; font: 800 38px/1.08 "Inter Display", Inter, sans-serif; letter-spacing: -0.025em; }
.top h1 em { font-style: normal; color: var(--live); } .top h1 s { text-decoration: none; color: var(--bad); }
.top p { margin: 8px 0 0; font: 500 19px/1.3 Inter, sans-serif; color: var(--muted); }
.bubble { position: absolute; left: 28px; top: 74px; z-index: 4; background: var(--accent); color: #0b0f15; font: 700 21px/1 Inter, sans-serif; padding: 12px 17px; border-radius: 18px 18px 6px 18px; white-space: nowrap; opacity: 0; transition: opacity .25s; }
.bubble.on { opacity: 1; } .bubble.typing::after { content: "▍"; }
.lane { position: absolute; left: 20px; right: 20px; height: 352px; border-radius: 24px; padding: 18px 20px; display: flex; gap: 16px; }
.lane.t { top: 152px; background: #17121a; border: 2px solid #3a2530; }
.lane.l { top: 516px; background: #0f1a17; border: 2px solid #1f4436; }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.who { font: 800 19px/1 "JetBrains Mono", monospace; letter-spacing: .1em; }
.lane.t .who { color: var(--t); } .lane.l .who { color: var(--live); }
.how { margin-top: 6px; font: 500 15px/1.25 Inter, sans-serif; color: var(--muted); }
.clock { margin-top: 26px; font: 800 66px/0.95 "Inter Display", Inter, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; white-space: nowrap; }
.lane.t .clock { color: var(--t); } .lane.l .clock { color: var(--live); }
.clock.idle { color: #36404f !important; }
.clocklbl { margin-top: 6px; font: 600 17px Inter, sans-serif; color: var(--muted); min-height: 22px; }
.status { margin-top: auto; font: 700 23px/1.2 Inter, sans-serif; min-height: 56px; display: flex; align-items: flex-end; gap: 8px; }
.status.act { color: var(--accent); } .status.ok { color: var(--live); } .status.bad { color: var(--bad); } .status.warn { color: var(--warn); }
.status .ff { display: inline-block; font: 700 13px "JetBrains Mono", monospace; color: #d9ccff; background: #2b2140; border: 1px solid #5b4a8a; border-radius: 99px; padding: 4px 9px; margin-bottom: 4px; white-space: nowrap; }
.phone { width: 262px; flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 22px; padding: 8px; display: flex; flex-direction: column; position: relative; transition: border-color .3s, box-shadow .3s; }
.phone.live { border-color: var(--live); box-shadow: 0 0 0 5px rgba(61,220,151,.22); }
.phone.held { border-color: var(--warn); box-shadow: 0 0 0 5px rgba(255,179,71,.25); }
.phone.broken { border-color: var(--bad); box-shadow: 0 0 0 5px rgba(255,93,115,.28); }
.screen, iframe { flex: 1; min-height: 0; background: #fff; color: #18202b; border-radius: 15px; border: 0; overflow: hidden; width: 100%; }
.screen { padding: 14px; }
.chip { position: absolute; left: 50%; transform: translateX(-50%); top: -16px; z-index: 3; white-space: nowrap; font: 800 15px/1 Inter, sans-serif; padding: 8px 12px; border-radius: 99px; background: #2a3344; color: #dfe6f2; border: 2px solid #3e4a5f; opacity: 0; transition: opacity .25s; }
.chip.on { opacity: 1; } .chip.lost { background: var(--bad); border-color: var(--bad); color: #160b0e; } .chip.kept { background: var(--live); border-color: var(--live); color: #08140f; }
.stamp { position: absolute; inset: 40px 14px; z-index: 3; display: grid; place-items: center; text-align: center; opacity: 0; transform: scale(1.15) rotate(-6deg); transition: all .25s; pointer-events: none; }
.stamp.on { opacity: 1; transform: scale(1) rotate(-6deg); }
.stamp div { border: 5px solid; border-radius: 16px; padding: 12px 16px; background: rgba(11,15,21,.88); }
.stamp b { display: block; font: 900 40px/1 "Inter Display", Inter, sans-serif; letter-spacing: .02em; }
.stamp span { display: block; margin-top: 6px; font: 700 15px/1.2 Inter, sans-serif; color: #e8ecf3; }
.stamp.warn div { border-color: var(--warn); } .stamp.warn b { color: var(--warn); }
.stamp.bad div { border-color: var(--bad); } .stamp.bad b { color: var(--bad); }
.stamp.ok div { border-color: var(--live); } .stamp.ok b { color: var(--live); }
.u-col { display: flex; flex-direction: column; gap: 6px; }
.u-row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.u-row > .u-input { flex: 1 1 90px; } .u-row > .u-toggle { flex: 1 1 auto; }
.u-heading { font: 800 23px/1.1 "Inter Display", Inter, sans-serif; margin: 0; }
.u-label { color: #657085; font-size: 14px; }
.u-big { font: 800 21px/1 "Inter Display", Inter, sans-serif; }
.u-button { font: 600 14px/1 Inter, sans-serif; padding: 7px 10px; border-radius: 9px; border: 1px solid #e3e7ee; background: #eef1f6; color: #18202b; }
.u-button[data-style="primary"] { background: #2c46e8; border-color: #2c46e8; color: #fff; }
.u-input { font: 15px Inter, sans-serif; padding: 7px 10px; border-radius: 9px; border: 1px solid #e3e7ee; min-width: 0; }
.u-toggle { display: flex; align-items: center; gap: 10px; padding: 5px 2px; border: 0; border-bottom: 1px solid #e3e7ee; background: none; font: 16px Inter, sans-serif; color: #18202b; text-align: left; width: 100%; }
.u-toggle .box { width: 19px; height: 19px; border-radius: 6px; border: 2px solid #657085; flex: none; }
.u-toggle[aria-pressed="true"] .box { background: #12855a; border-color: #12855a; }
.u-toggle[aria-pressed="true"] .t { color: #657085; text-decoration: line-through; }
.u-progress { height: 10px; border-radius: 99px; background: #eef1f6; overflow: hidden; }
.u-progress > i { display: block; height: 100%; background: #12855a; }
.foot { position: absolute; left: 28px; right: 28px; bottom: 12px; font: 500 13px "JetBrains Mono", monospace; color: #6b7789; text-align: center; }
.card { position: absolute; inset: 0; z-index: 10; background: var(--bg); display: none; flex-direction: column; justify-content: center; padding: 0 50px; }
.card.on { display: flex; }
.card .k { font: 800 18px "JetBrains Mono", monospace; letter-spacing: .14em; color: var(--muted); margin-bottom: 18px; }
.card .vs { display: flex; flex-direction: column; gap: 22px; }
.card .vs div { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; border-top: 2px solid var(--line); padding-top: 18px; }
.card .vs span { font: 800 22px "JetBrains Mono", monospace; letter-spacing: .1em; }
.card .vs b { font: 800 64px/1 "Inter Display", Inter, sans-serif; letter-spacing: -0.03em; text-align: right; }
.card .t span, .card .t b { color: var(--t); } .card .l span, .card .l b { color: var(--live); }
.card p { margin: 34px 0 0; font: 600 28px/1.3 Inter, sans-serif; color: #dfe6f2; }
.card .src { margin-top: 30px; font: 500 15px/1.4 "JetBrains Mono", monospace; color: #6b7789; }
</style>
<div class="top"><h1 id="title"></h1><p id="sub"></p></div>
<div class="bubble" id="bubble"></div>
<div class="lane t"><div class="info"><div class="who">TODAY</div><div class="how" id="how-t">git push → CI → restart</div>
  <div class="clock idle" id="clock-t">0.0 s</div><div class="clocklbl" id="lbl-t"></div><div class="status" id="status-t"></div></div>
  <div class="phone" id="phone-t"><div class="chip"></div><iframe id="today"></iframe><div class="stamp"><div><b></b><span></span></div></div></div></div>
<div class="lane l"><div class="info"><div class="who">WITH LLP</div><div class="how">new code streams into the running app</div>
  <div class="clock idle" id="clock-l">0.0 s</div><div class="clocklbl" id="lbl-l"></div><div class="status" id="status-l"></div></div>
  <div class="phone" id="phone-l"><div class="chip"></div><div class="screen" id="screen"></div><div class="stamp"><div><b></b><span></span></div></div></div></div>
<div class="foot" id="foot">Real recording of both sides. Clocks show real time.</div>
<div class="card" id="card"></div>
<script type="module">
import { LiveHost, b64 } from "/host/llp-core.js";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
if (q.get("zoom")) document.documentElement.style.zoom = q.get("zoom"); // the recorder renders at 1.5x
const trusted = await (await fetch("/key")).json();

// ---- the LLP device ----
function txt(n) { return (n.c || []).filter((c) => c.k === "text").map((c) => c.t).join(""); }
let build = 0;
function make(n, slot) {
  const a = n.a || {}; let el;
  switch (n.k) {
    case "text": return document.createTextNode(n.t);
    case "heading": el = document.createElement("h3"); el.className = "u-heading"; el.textContent = txt(n); return el;
    case "label": el = document.createElement("div"); el.className = "u-label"; el.textContent = txt(n); return el;
    case "big": el = document.createElement("div"); el.className = "u-big"; el.textContent = txt(n); return el;
    case "button": el = document.createElement("button"); el.className = "u-button"; el.textContent = txt(n); el.dataset.id = a.id;
      if (a.style) el.dataset.style = a.style; el.onclick = () => host.dispatch(slot, a.id); return el;
    case "toggle": el = document.createElement("button"); el.className = "u-toggle"; el.dataset.id = a.id; el.setAttribute("aria-pressed", a.on === "1");
      el.innerHTML = '<span class="box"></span><span class="t"></span>'; el.lastChild.textContent = txt(n); el.onclick = () => host.dispatch(slot, a.id); return el;
    case "input": el = document.createElement("input"); el.className = "u-input"; el.id = "in-" + a.bind; el.placeholder = a.placeholder || "";
      el.value = host.kv.get(a.bind) ?? ""; el.oninput = () => host.setBound(a.bind, el.value);
      el.onkeydown = (e) => { if (e.key === "Enter" && a.submit) host.dispatch(slot, a.submit); }; return el;
    case "progress": el = document.createElement("div"); el.className = "u-progress"; el.innerHTML = "<i></i>"; el.firstChild.style.width = (+a.value || 0) + "%"; return el;
    default: el = document.createElement("div"); el.className = "u-" + (["col", "row"].includes(n.k) ? n.k : "col");
      for (const c of n.c || []) el.appendChild(make(c, slot)); return el;
  }
}
function paint(slots) {
  const f = document.activeElement, keep = f?.id?.startsWith("in-") ? f.id : null;
  const frag = document.createDocumentFragment();
  for (const s of slots) if (s.slot === "main") frag.appendChild(s.error ? document.createTextNode(s.error) : make(s.tree, s.slot));
  $("screen").replaceChildren(frag);
  if (keep) $(keep)?.focus();
}
const host = new LiveHost({ app: "demo.tasks", trustedKeys: [trusted], capabilities: { haptic: async () => "ok" }, onRender: paint, onLog: () => {} });
JSON.parse(q.get("tasks")).forEach(([t, d], k) => { host.kv.set(`tasks.${k}.text`, t); host.kv.set(`tasks.${k}.done`, d); });
host.kv.set("tasks.n", JSON.parse(q.get("tasks")).length);
const swaps = [];
const ws = new WebSocket(`ws://127.0.0.1:${q.get("port")}`), pending = new Map();
const send = (m) => ws.send(JSON.stringify(m));
ws.onopen = () => send({ t: "hello", llp: 1, app: "demo.tasks", version: host.version, have: [] });
ws.onmessage = async (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.t === "blob") pending.get(msg.hash)?.(b64.dec(msg.data));
  if (msg.t === "manifest") {
    const r = await host.apply(msg.manifest, msg.sig, (h) => new Promise((res) => { pending.set(h, res); send({ t: "want", hashes: [h] }); }));
    send(r.ok ? { t: "ack", version: r.version, ms: r.ms } : { t: "nack", version: r.version, code: r.code, reason: r.reason });
    if (r.ok) { build++; swaps.push({ build, ms: r.ms, tasks: host.kv.get("tasks.n") ?? 0, draft: host.kv.get("draft") ?? "", at: Date.now() }); }
  }
};

// ---- the today device: the real today app in an iframe; count its page loads ----
let todayLoads = 0;
$("today").addEventListener("load", () => { todayLoads++; });
$("today").src = q.get("today");

// ---- clocks: real elapsed time ----
const clocks = { t: null, l: null };
const fmtS = (ms) => ms < 10000 ? `${(ms / 1000).toFixed(1)} s` : ms < 60000 ? `${Math.floor(ms / 1000)} s` : `${Math.floor(ms / 60000)} min ${Math.floor(ms / 1000) % 60} s`;
(function tick() { for (const s of ["t", "l"]) { const c = clocks[s]; if (c?.running) $("clock-" + s).textContent = fmtS(Date.now() - c.start); } requestAnimationFrame(tick); })();
const phone = (s) => $("phone-" + s);

window.stage = {
  swaps, host,
  ready: () => build === 1 && todayLoads >= 1,
  todayLoads: () => todayLoads,
  llpState: () => ({ n: host.kv.get("tasks.n") ?? 0, build, draft: host.kv.get("draft") ?? "" }),
  title(html, sub = "") { $("title").innerHTML = html; $("sub").textContent = sub; },
  ask(text) { $("bubble").classList.toggle("on", text !== null); $("bubble").textContent = text ?? ""; },
  typing(on) { $("bubble").classList.toggle("typing", on); },
  how(text) { $("how-t").textContent = text; },
  clockStart(s, at, label = "") { clocks[s] = { start: at ?? Date.now(), running: true }; $("clock-" + s).classList.remove("idle"); $("lbl-" + s).textContent = label; },
  clockStop(s, at, label = "") { const c = clocks[s]; c.running = false; $("clock-" + s).textContent = fmtS((at ?? Date.now()) - c.start); $("lbl-" + s).textContent = label; },
  clockReset(s) { clocks[s] = null; $("clock-" + s).textContent = "0.0 s"; $("clock-" + s).classList.add("idle"); $("lbl-" + s).textContent = ""; },
  status(s, text, cls = "", ff = "") { const el = $("status-" + s); el.className = "status " + cls; el.textContent = text; if (ff) { const f = document.createElement("span"); f.className = "ff"; f.textContent = ff; el.appendChild(f); } },
  phone(s, state) { phone(s).className = "phone " + (state || ""); },
  chip(s, text, cls = "") { const c = phone(s).querySelector(".chip"); if (text === null) return c.classList.remove("on"); c.className = "chip on " + cls; c.textContent = text; },
  stamp(s, big, small = "", cls = "") { const st = phone(s).querySelector(".stamp"); if (big === null) return st.classList.remove("on"); st.className = "stamp on " + cls; st.querySelector("b").textContent = big; st.querySelector("span").textContent = small; },
  foot(text) { $("foot").textContent = text; },
  card(html) { if (html === null) return $("card").classList.remove("on"); $("card").innerHTML = html; $("card").classList.add("on"); },
};
</script>
