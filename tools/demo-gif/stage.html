<!doctype html>
<meta charset="utf-8">
<title>LLP demo stage</title>
<!-- The recording stage for tools/demo-gif/record.mjs. Both sides are real:
     Left ("Today"): the conventional tasks app (tools/demo-gif/today-app) in an iframe, served by a Node
     server that the real pipeline (today-pipeline.mjs: git push, GitHub Actions, restart) redeploys.
     Right ("With LLP"): a real Live Host (host/llp-core.js) connected to the real AI publisher.
     Clocks are real elapsed time; when the recording is sped up, the page says so. -->
<style>
:root { --bg: #0b0f15; --panel: #141b26; --line: #263244; --ink: #f2f5fa; --muted: #8592a6;
  --live: #3ddc97; --bad: #ff5d73; --warn: #ffb347; --accent: #8b9bff; --t: #ff8a9b; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink); font: 18px/1.35 Inter, system-ui, sans-serif; }
.top { position: absolute; left: 36px; right: 36px; top: 20px; height: 92px; display: flex; align-items: center; gap: 20px; }
.top h1 { margin: 0; font: 800 42px/1.06 "Inter Display", Inter, sans-serif; letter-spacing: -0.025em; flex: 1; }
.top h1 em { font-style: normal; color: var(--live); } .top h1 s { text-decoration: none; color: var(--bad); }
.bubble { background: var(--accent); color: #0b0f15; font: 600 23px/1 Inter, sans-serif; padding: 14px 19px; border-radius: 20px 20px 6px 20px; white-space: nowrap; opacity: 0; transition: opacity .25s; }
.bubble.on { opacity: 1; } .bubble.typing::after { content: "▍"; }
.ff { position: absolute; left: 50%; top: 122px; transform: translateX(-50%); z-index: 5; background: #2b2140; color: #d9ccff; border: 1px solid #5b4a8a; font: 700 15px "JetBrains Mono", monospace; padding: 6px 14px; border-radius: 99px; opacity: 0; transition: opacity .2s; }
.ff.on { opacity: 1; }
.col { position: absolute; top: 122px; bottom: 34px; width: 594px; border-radius: 24px; padding: 18px 20px; }
.today { left: 36px; background: #17121a; border: 2px solid #3a2530; }
.llp { right: 36px; background: #0f1a17; border: 2px solid #1f4436; }
.col h2 { margin: 0; font: 800 17px/1 "JetBrains Mono", monospace; letter-spacing: .12em; }
.col h2 small { display: block; margin-top: 5px; font: 500 13px "JetBrains Mono", monospace; letter-spacing: 0; color: var(--muted); }
.today h2 { color: var(--t); } .llp h2 { color: var(--live); }
.body { position: absolute; left: 20px; right: 20px; top: 66px; bottom: 18px; display: flex; gap: 16px; }
.side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.clock { font: 800 50px/1 "Inter Display", Inter, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.today .clock { color: var(--t); } .llp .clock { color: var(--live); }
.clock.idle { color: #3a4556 !important; }
.clocklbl { font: 500 14px Inter, sans-serif; color: var(--muted); margin-top: -4px; }
.steps { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
.step { display: flex; gap: 10px; align-items: flex-start; color: #536074; }
.step .ic { width: 24px; height: 24px; flex: none; border-radius: 50%; border: 2px solid #344155; display: grid; place-items: center; font: 800 13px/1 Inter, sans-serif; }
.step b { display: block; font: 700 17px/1.2 Inter, sans-serif; }
.step span { display: block; font: 500 14px/1.25 Inter, sans-serif; min-height: 17px; overflow-wrap: anywhere; }
.step.act { color: var(--ink); } .step.act .ic { border-color: var(--accent); animation: pulse .8s ease-in-out infinite alternate; } .step.act span { color: var(--accent); }
.step.ok { color: var(--ink); } .step.ok .ic { background: var(--live); border-color: var(--live); color: #0b0f15; } .step.ok .ic::before { content: "✓"; } .step.ok span { color: var(--live); }
.step.bad { color: var(--ink); } .step.bad .ic { background: var(--bad); border-color: var(--bad); color: #0b0f15; } .step.bad .ic::before { content: "✕"; } .step.bad span { color: var(--bad); }
.step.warn span { color: var(--warn); }
@keyframes pulse { from { box-shadow: 0 0 0 0 rgba(139,155,255,.5); } to { box-shadow: 0 0 0 7px rgba(139,155,255,0); } }
.phone { width: 300px; flex: none; background: var(--panel); border: 2px solid var(--line); border-radius: 24px; padding: 9px; display: flex; flex-direction: column; position: relative; transition: border-color .3s, box-shadow .3s; }
.phone.live { border-color: var(--live); box-shadow: 0 0 0 5px rgba(61,220,151,.22); }
.phone.held { border-color: var(--warn); box-shadow: 0 0 0 5px rgba(255,179,71,.22); }
.phone.broken { border-color: var(--bad); box-shadow: 0 0 0 5px rgba(255,93,115,.25); }
.pbar { padding: 1px 8px 7px; font: 600 12px "JetBrains Mono", monospace; color: var(--muted); }
.screen, iframe { flex: 1; min-height: 0; background: #fff; color: #18202b; border-radius: 16px; border: 0; overflow: hidden; width: 100%; }
.screen { padding: 16px; }
.badge { position: absolute; left: 50%; bottom: 14px; transform: translate(-50%, 14px); opacity: 0; transition: all .3s; background: #0b0f15; color: #fff; border-radius: 13px; padding: 9px 14px; text-align: center; white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.badge.on { opacity: 1; transform: translate(-50%, 0); }
.badge b { display: block; font: 800 25px/1 "Inter Display", Inter, sans-serif; color: var(--live); }
.badge span { display: block; margin-top: 4px; font: 600 13px Inter, sans-serif; color: #c9d2e0; }
.badge.warn b { color: var(--warn); } .badge.bad b { color: var(--bad); }
.slot + .slot { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #e3e7ee; }
.u-col { display: flex; flex-direction: column; gap: 7px; }
.u-row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
.u-row > .u-input { flex: 1 1 100px; } .u-row > .u-toggle { flex: 1 1 auto; }
.u-heading { font: 800 24px/1.1 "Inter Display", Inter, sans-serif; margin: 0; }
.u-label { color: #657085; font-size: 14px; }
.u-big { font: 800 21px/1 "Inter Display", Inter, sans-serif; }
.u-button { font: 600 14px/1 Inter, sans-serif; padding: 7px 10px; border-radius: 9px; border: 1px solid #e3e7ee; background: #eef1f6; color: #18202b; }
.u-button[data-style="primary"] { background: #2c46e8; border-color: #2c46e8; color: #fff; }
.u-input { font: 15px Inter, sans-serif; padding: 7px 10px; border-radius: 9px; border: 1px solid #e3e7ee; min-width: 0; }
.u-toggle { display: flex; align-items: center; gap: 10px; padding: 5px 2px; border: 0; border-bottom: 1px solid #e3e7ee; background: none; font: 16px Inter, sans-serif; color: #18202b; text-align: left; width: 100%; }
.u-toggle .box { width: 19px; height: 19px; border-radius: 6px; border: 2px solid #657085; flex: none; display: grid; place-items: center; }
.u-toggle[aria-pressed="true"] .box { background: #12855a; border-color: #12855a; }
.u-toggle[aria-pressed="true"] .t { color: #657085; text-decoration: line-through; }
.u-progress { height: 10px; border-radius: 99px; background: #eef1f6; overflow: hidden; }
.u-progress > i { display: block; height: 100%; background: #12855a; }
.new { animation: glow 2.4s ease-out; border-radius: 8px; }
@keyframes glow { 0%, 50% { box-shadow: 0 0 0 3px #3ddc97; background: rgba(61,220,151,.12); } 100% { box-shadow: 0 0 0 3px transparent; } }
.src { position: absolute; left: 36px; right: 36px; bottom: 10px; font: 500 12px "JetBrains Mono", monospace; color: #6b7789; }
.end { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; justify-content: center; padding: 0 80px; }
.end.on { display: flex; }
.end h2 { font: 800 54px/1.05 "Inter Display", Inter, sans-serif; letter-spacing: -0.03em; margin: 0 0 28px; }
.end h2 em { font-style: normal; color: var(--live); }
.end table { border-collapse: collapse; font: 600 25px/1.2 Inter, sans-serif; }
.end th { font: 800 17px "JetBrains Mono", monospace; letter-spacing: .12em; text-align: left; padding: 0 28px 10px 0; }
.end th.t { color: var(--t); } .end th.l { color: var(--live); }
.end td { padding: 11px 28px 11px 0; border-top: 1px solid var(--line); }
.end td:first-child { color: var(--muted); font-weight: 500; } .end td.t { color: #ffb3bf; } .end td.l { color: var(--live); }
.end .src2 { margin-top: 26px; font: 500 14px "JetBrains Mono", monospace; color: #6b7789; }
</style>
<div class="top"><h1 id="title"></h1><span class="bubble" id="bubble"></span></div>
<div class="ff" id="ff"></div>
<div class="col today"><h2>TODAY<small id="today-how">git push → CI → restart</small></h2>
  <div class="body"><div class="side"><div class="clock idle" id="clock-t">0.0 s</div><div class="clocklbl" id="lbl-t">&nbsp;</div><div class="steps" id="steps-t"></div></div>
  <div class="phone" id="phone-t"><div class="pbar">Today's app</div><iframe id="today"></iframe><div class="badge"><b></b><span></span></div></div></div></div>
<div class="col llp"><h2>WITH LLP<small>stream → check → live swap</small></h2>
  <div class="body"><div class="side"><div class="clock idle" id="clock-l">0.0 s</div><div class="clocklbl" id="lbl-l">&nbsp;</div><div class="steps" id="steps-l"></div></div>
  <div class="phone" id="phone-l"><div class="pbar">LLP app</div><div class="screen" id="screen"></div><div class="badge"><b></b><span></span></div></div></div></div>
<div class="src" id="src">Both sides are real and run at the same time on the same requests. Clocks show real elapsed time.</div>
<div class="end" id="end"></div>
<script type="module">
import { LiveHost, b64 } from "/host/llp-core.js";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const trusted = await (await fetch("/key")).json();

// ---- the LLP device ----
function txt(n) { return (n.c || []).filter((c) => c.k === "text").map((c) => c.t).join(""); }
const keyOf = (el) => el.className.split(" ")[0] + "|" + (el.dataset.id?.replace(/\d+$/, "") ?? "") + "|" + (el.children.length ? "" : el.textContent.replace(/\d+/g, "#"));
let prevKeys = null, glowNext = false, build = 0;
function make(n, slot) {
  const a = n.a || {}; let el;
  switch (n.k) {
    case "text": return document.createTextNode(n.t);
    case "heading": el = document.createElement("h3"); el.className = "u-heading"; el.textContent = txt(n); return el;
    case "label": el = document.createElement("div"); el.className = "u-label"; el.textContent = txt(n); return el;
    case "big": el = document.createElement("div"); el.className = "u-big"; el.textContent = txt(n); return el;
    case "button": el = document.createElement("button"); el.className = "u-button"; el.textContent = txt(n); el.dataset.id = a.id;
      if (a.style) el.dataset.style = a.style; el.onclick = () => host.dispatch(slot, a.id); return el;
    case "toggle": el = document.createElement("button"); el.className = "u-toggle"; el.dataset.id = a.id; el.setAttribute("aria-pressed", a.on === "1");
      el.innerHTML = '<span class="box"></span><span class="t"></span>'; el.lastChild.textContent = txt(n); el.onclick = () => host.dispatch(slot, a.id); return el;
    case "input": el = document.createElement("input"); el.className = "u-input"; el.id = "in-" + a.bind; el.placeholder = a.placeholder || "";
      el.value = host.kv.get(a.bind) ?? ""; el.oninput = () => host.setBound(a.bind, el.value);
      el.onkeydown = (e) => { if (e.key === "Enter" && a.submit) host.dispatch(slot, a.submit); }; return el;
    case "progress": el = document.createElement("div"); el.className = "u-progress"; el.innerHTML = "<i></i>"; el.firstChild.style.width = (+a.value || 0) + "%"; return el;
    default: el = document.createElement("div"); el.className = "u-" + (["col", "row"].includes(n.k) ? n.k : "col");
      for (const c of n.c || []) el.appendChild(make(c, slot)); return el;
  }
}
function paint(slots) {
  const f = document.activeElement, keep = f?.id?.startsWith("in-") ? f.id : null;
  const frag = document.createDocumentFragment();
  for (const s of slots) { if (s.slot !== "main") continue; const box = document.createElement("div"); box.className = "slot"; box.appendChild(s.error ? document.createTextNode(s.error) : make(s.tree, s.slot)); frag.appendChild(box); }
  $("screen").replaceChildren(frag);
  const els = [...$("screen").querySelectorAll("[class^=u-]")];
  if (glowNext && prevKeys) for (const el of els) if (!prevKeys.has(keyOf(el))) el.classList.add("new");
  glowNext = false; prevKeys = new Set(els.map(keyOf));
  if (keep) $(keep)?.focus();
}
const host = new LiveHost({ app: "demo.tasks", trustedKeys: [trusted], capabilities: { haptic: async () => "ok" }, onRender: paint, onLog: () => {} });
JSON.parse(q.get("tasks")).forEach(([t, d], k) => { host.kv.set(`tasks.${k}.text`, t); host.kv.set(`tasks.${k}.done`, d); });
host.kv.set("tasks.n", JSON.parse(q.get("tasks")).length);
const swaps = [];
const ws = new WebSocket(`ws://127.0.0.1:${q.get("port")}`), pending = new Map();
const send = (m) => ws.send(JSON.stringify(m));
ws.onopen = () => send({ t: "hello", llp: 1, app: "demo.tasks", version: host.version, have: [] });
ws.onmessage = async (ev) => {
  const msg = JSON.parse(ev.data);
  if (msg.t === "blob") pending.get(msg.hash)?.(b64.dec(msg.data));
  if (msg.t === "manifest") {
    glowNext = build > 0;
    const r = await host.apply(msg.manifest, msg.sig, (h) => new Promise((res) => { pending.set(h, res); send({ t: "want", hashes: [h] }); }));
    send(r.ok ? { t: "ack", version: r.version, ms: r.ms } : { t: "nack", version: r.version, code: r.code, reason: r.reason });
    if (r.ok) { build++; swaps.push({ build, ms: r.ms, tasks: host.kv.get("tasks.n") ?? 0, draft: host.kv.get("draft") ?? "", at: Date.now() }); }
  }
};

// ---- the today device: the real today app in an iframe; count its page loads ----
let todayLoads = 0;
$("today").addEventListener("load", () => { todayLoads++; });
$("today").src = q.get("today");

// ---- clocks: real elapsed time per side ----
const clocks = { t: null, l: null };
function tick() {
  for (const s of ["t", "l"]) { const c = clocks[s]; if (c?.running) $("clock-" + s).textContent = fmtS(Date.now() - c.start); }
  requestAnimationFrame(tick);
}
function fmtS(ms) { if (ms < 1000) return `${(ms / 1000).toFixed(2)} s`; if (ms < 60000) return `${(ms / 1000).toFixed(1)} s`; return `${Math.floor(ms / 60000)}m ${String(Math.floor(ms / 1000) % 60).padStart(2, "0")}s`; }
tick();
const sideEl = (s, part) => $(`${part}-${s}`);
const phoneOf = (s) => $(s === "t" ? "phone-t" : "phone-l");

window.stage = {
  swaps, host,
  ready: () => build === 1 && todayLoads >= 1,
  todayLoads: () => todayLoads,
  llpState: () => ({ n: host.kv.get("tasks.n") ?? 0, build, draft: host.kv.get("draft") ?? "" }),
  title(html) { $("title").innerHTML = html; },
  ask(text) { $("bubble").classList.toggle("on", text !== null); $("bubble").textContent = text ?? ""; },
  typing(on) { $("bubble").classList.toggle("typing", on); },
  clockStart(s, at) { clocks[s] = { start: at ?? Date.now(), running: true }; $("clock-" + s).classList.remove("idle"); $("lbl-" + s).innerHTML = "&nbsp;"; },
  clockStop(s, at, label) { const c = clocks[s]; c.running = false; $("clock-" + s).textContent = fmtS((at ?? Date.now()) - c.start); $("lbl-" + s).textContent = label ?? ""; },
  clockReset(s) { clocks[s] = null; $("clock-" + s).textContent = "0.0 s"; $("clock-" + s).classList.add("idle"); $("lbl-" + s).innerHTML = "&nbsp;"; },
  steps(s, list) { sideEl(s, "steps").innerHTML = list.map((b, i) => `<div class="step" data-i="${i}"><div class="ic"></div><div><b>${b}</b><span></span></div></div>`).join(""); },
  step(s, i, state, detail = "") { const el = sideEl(s, "steps").children[i]; el.className = "step " + state; el.querySelector("span").textContent = detail; },
  phone(s, state) { phoneOf(s).className = "phone " + (state || ""); },
  badge(s, big, small, cls = "") { const b = phoneOf(s).querySelector(".badge"); if (big === null) return b.classList.remove("on"); b.className = "badge on " + cls; b.firstChild.textContent = big; b.lastChild.textContent = small; },
  ff(text) { $("ff").textContent = text ?? ""; $("ff").classList.toggle("on", !!text); },
  how(text) { $("today-how").textContent = text; },
  end(html) { $("end").innerHTML = html; $("end").classList.add("on"); },
};
</script>
