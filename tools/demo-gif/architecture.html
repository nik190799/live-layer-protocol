<!doctype html>
<meta charset="utf-8">
<title>How LLP works</title>
<!-- "How LLP works" image for launch posts: the protocol itself, as a sequence diagram of the real wire
     messages. Rendered to docs/llp-architecture.png (1080x1350) by node tools/demo-gif/render-architecture.mjs.
     Messages are SPEC.md section 5, host checks section 6, ABI section 7, limits DEFAULT_LIMITS in host/llp-core.js. -->
<style>
:root { --bg: #f4f3ef; --ink: #121212; --mid: #6b6b66; --rule: #cfcdc6; --acc: #1f6f50; --bad: #a8402f; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 720px; height: 900px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Inter, sans-serif; }
.wrap { padding: 50px 56px 0; }
.k { font: 500 12px "JetBrains Mono", monospace; letter-spacing: .14em; color: var(--mid); }
h1 { margin: 14px 0 0; font: 600 46px/1.05 "Inter Display", Inter, sans-serif; letter-spacing: -0.025em; }
.sub { margin: 10px 0 0; font: 500 17px/1.4 Inter, sans-serif; color: var(--mid); max-width: 600px; }
svg { display: block; margin-top: 44px; overflow: visible; }
svg text { font-family: "JetBrains Mono", monospace; font-size: 11.5px; fill: var(--ink); }
svg .m { fill: var(--mid); } svg .h { font-size: 10.5px; letter-spacing: .12em; fill: var(--mid); }
svg .b { font-weight: 700; } svg .w { fill: #f4f3ef; } svg .a { fill: var(--acc); } svg .r { fill: var(--bad); }
</style>
<div class="wrap">
  <div class="k">PROTOCOL SPEC · v0</div>
  <h1>Live Layer Protocol</h1>
  <p class="sub">Streams signed WebAssembly layers into running software. The host verifies each one, swaps it in place and rolls it back on its own.</p>
  <svg width="608" height="634" viewBox="0 0 608 634">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#121212"/></marker>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a8402f"/></marker>
      <pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#c3c0b8" stroke-width="2"/></pattern>
    </defs>

    <!-- lifelines -->
    <rect x="0.5" y="0.5" width="96" height="26" fill="none" stroke="#121212"/><text class="h" x="11" y="18">PUBLISHER</text>
    <rect x="300.5" y="0.5" width="96" height="26" fill="none" stroke="#121212"/><text class="h" x="311" y="18">LIVE HOST</text>
    <line x1="48" y1="27" x2="48" y2="372" stroke="#121212" stroke-dasharray="2 4"/>
    <line x1="348" y1="27" x2="348" y2="372" stroke="#121212" stroke-dasharray="2 4"/>
    <text class="m" x="414" y="18">on the device, in place</text>

    <!-- 1 hello -->
    <line x1="346" y1="62" x2="51" y2="62" stroke="#121212" marker-end="url(#ar)"/>
    <text class="b" x="62" y="54">hello</text><text class="m" x="110" y="54">app · version 1 · have[…]</text>
    <!-- 2 manifest -->
    <line x1="50" y1="112" x2="340" y2="112" stroke="#121212" marker-end="url(#ar)"/>
    <text class="b" x="62" y="104">manifest</text><text class="m" x="134" y="104">v2 · main → 9f3a…</text>
    <text class="m" x="62" y="128">+ sig  ECDSA P-256</text>
    <!-- 3 want -->
    <line x1="346" y1="172" x2="51" y2="172" stroke="#121212" marker-end="url(#ar)"/>
    <text class="b" x="62" y="164">want</text><text class="m" x="102" y="164">[9f3a…]  only missing hashes</text>
    <!-- 4 blob -->
    <line x1="50" y1="222" x2="340" y2="222" stroke="#121212" marker-end="url(#ar)"/>
    <text class="b" x="62" y="214">blob</text><text class="m" x="102" y="214">9f3a… · wasm bytes</text>
    <!-- 5 ack / nack -->
    <line x1="346" y1="318" x2="51" y2="318" stroke="#1f6f50" stroke-width="1.5" marker-end="url(#ar)"/>
    <text class="b a" x="62" y="310">ack</text><text class="m" x="94" y="310">version 2 · swapped in ms</text>
    <line x1="346" y1="352" x2="51" y2="352" stroke="#a8402f" stroke-dasharray="4 3" marker-end="url(#arr)"/>
    <text class="b r" x="62" y="344">nack</text><text class="m" x="102" y="344">reason · v1 keeps running</text>

    <!-- host-side steps -->
    <g fill="#f4f3ef" stroke="#121212"><rect x="342" y="92" width="12" height="40"/><rect x="342" y="202" width="12" height="104"/></g>
    <text x="368" y="106">signature from a trusted key</text>
    <text x="368" y="124">version &gt; running, else reject</text>
    <text x="368" y="216">sha-256 = declared hash</text>
    <text x="368" y="234">shadow copy of state</text>
    <text x="368" y="252">instantiate · migrate · render</text>
    <rect x="364" y="264" width="244" height="30" fill="#1f6f50"/>
    <text class="w" x="374" y="284">commit · atomic slot swap</text>
    <text class="r" x="368" y="404">runtime trap → revert to v1,</text>
    <text class="r" x="368" y="420">state restored</text>
    <path d="M348 372 V412 H360" fill="none" stroke="#a8402f" stroke-dasharray="4 3" marker-end="url(#arr)"/>

    <!-- layer + state -->
    <text class="h" x="0" y="496">A LAYER</text>
    <rect x="0.5" y="506" width="296" height="122" fill="none" stroke="#121212"/>
    <text x="14" y="528">wasm module · sandboxed worker</text>
    <text class="m" x="14" y="550">exports</text><text x="80" y="550">llp_view  llp_event</text>
    <text x="80" y="568">llp_schema  llp_migrate</text>
    <text class="m" x="14" y="590">imports</text><text x="80" y="590">ui_*  kv_*  ev_*  cap</text>
    <text class="m" x="14" y="614">limits</text><text x="80" y="614">100 ms per call · 32 MB</text>

    <text class="h" x="312" y="496">HOST-OWNED STATE</text>
    <rect x="312.5" y="506" width="295" height="56" fill="url(#hat)" stroke="#121212"/>
    <rect x="324" y="523" width="236" height="22" fill="#f4f3ef"/>
    <text x="330" y="538">kv store · outlives every swap</text>
    <text class="m" x="312" y="590">transports</text><text x="400" y="590">websocket · in-page</text>
    <text class="m" x="312" y="614">hosts</text><text x="400" y="614">browser · node · go</text>
  </svg>
</div>
