<!doctype html>
<meta charset="utf-8">
<title>How LLP works</title>
<!-- "How LLP works" image for launch posts, kept to one glance. Rendered to docs/llp-architecture.png
     (1080x1350) by node tools/demo-gif/render-architecture.mjs. Claims are in SPEC.md sections 3, 6 and 6.1. -->
<style>
:root { --bg: #0b0f15; --panel: #141b26; --line: #2a3648; --ink: #f2f5fa; --muted: #8a96aa; --live: #3ddc97; --accent: #8b9bff; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 720px; height: 900px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
.wrap { height: 900px; padding: 0 44px; justify-content: center; display: flex; flex-direction: column; align-items: center; text-align: center; }
.k { font: 800 15px "JetBrains Mono", monospace; letter-spacing: .18em; color: var(--accent); }
h1 { margin: 12px 0 0; font: 800 54px/1.03 Inter, sans-serif; letter-spacing: -0.035em; }
h1 em { font-style: normal; color: var(--live); }
.flow { margin-top: 56px; display: flex; align-items: center; gap: 8px; }
.s { width: 122px; padding: 16px 6px 13px; border-radius: 20px; background: var(--panel); border: 2px solid var(--line); }
.s i { display: block; font: normal 34px/1 system-ui, sans-serif; }
.s b { display: block; margin-top: 9px; font: 800 18px Inter, sans-serif; }
.s.go { border-color: var(--live); background: #10241c; } .s.go b { color: var(--live); }
.ar { font: 800 24px Inter, sans-serif; color: #4a5a74; }
.down { margin: 10px 0 4px; font: 800 30px Inter, sans-serif; color: var(--live); line-height: 1; padding-left: 488px; }
.app { width: 632px; border: 2px solid var(--line); border-radius: 28px; padding: 18px 22px 22px; background: #10161f; }
.app .cap { font: 700 14px "JetBrains Mono", monospace; letter-spacing: .1em; color: var(--muted); }
.layers { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.l { height: 64px; border-radius: 14px; border: 2px solid #33415a; background: #1b2433; display: grid; place-items: center; font: 700 17px Inter, sans-serif; color: #c7d0de; }
.l.new { border-color: var(--live); background: #10241c; color: var(--live); box-shadow: 0 0 0 5px rgba(61,220,151,.16); }
.data { margin-top: 12px; height: 52px; border-radius: 14px; background: #2a2140; border: 2px solid #5b4a8a; display: grid; place-items: center; font: 700 17px Inter, sans-serif; color: #d9ccff; }
.wins { margin-top: 56px; display: flex; gap: 14px; }
.w { width: 198px; padding: 16px 8px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); font: 800 21px/1.2 Inter, sans-serif; }
.w span { color: var(--live); }
</style>
<div class="wrap">
  <div class="k">LIVE LAYER PROTOCOL</div>
  <h1>Change a <em>running</em> app<br>without restarting it</h1>
  <div class="flow">
    <div class="s"><i>🤖</i><b>AI edits</b></div><div class="ar">→</div>
    <div class="s"><i>🧪</i><b>Tested</b></div><div class="ar">→</div>
    <div class="s"><i>🔏</i><b>Signed</b></div><div class="ar">→</div>
    <div class="s go"><i>⚡</i><b>Swapped</b></div>
  </div>
  <div class="down">↓</div>
  <div class="app">
    <div class="cap">THE RUNNING APP</div>
    <div class="layers"><div class="l">Header</div><div class="l">Footer</div><div class="l new">Tasks v2</div></div>
    <div class="data">Your data stays put</div>
  </div>
  <div class="wins">
    <div class="w"><span>✓</span> No restart</div>
    <div class="w"><span>✓</span> Data kept</div>
    <div class="w"><span>✓</span> Bugs blocked</div>
  </div>
</div>
