# CI for the "today" side of the demo GIF (tools/demo-gif): a conventional pipeline that the
# recorder pushes a branch to, and times. Runs only on demo-today/* branches.
name: today-demo
on:
  push:
    branches: ["demo-today/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
        working-directory: tools/demo-gif/today-app/src
      - run: node --test test/*.test.mjs
        working-directory: tools/demo-gif/today-app/src
